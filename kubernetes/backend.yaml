apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: motorhub
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: shegxy69/motorhub-backend:v2
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-passwords
              key: password
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: motorhub
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000